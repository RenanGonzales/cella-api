services:
  db:
    image: postgres:16-alpine
    container_name: cella-db
    environment:
      POSTGRES_USER: cella
      POSTGRES_PASSWORD: cella
      POSTGRES_DB: cella
    ports:
      - "5432:5432"
    volumes:
      - cella-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cella -d cella"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  cella-db-data:
